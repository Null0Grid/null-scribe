name: Flatpak try (temporary)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      APP_ID: dev.nullgrid.scribe
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends flatpak flatpak-builder
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
          gh release download v5.1.0 -R ${{ github.repository }} -p 'null-scribe_5.1.0_x64.tar.gz' -D linux
      - name: Build
        run: |
          set -o pipefail
          node scripts/render-packaging.js flatpak-local linux/null-scribe_5.1.0_x64.tar.gz fp
          cat fp/$APP_ID.yml
          flatpak-builder --user --force-clean --disable-rofiles-fuse --repo=fp-repo fp-build fp/$APP_ID.yml 2>&1 | tee build.log
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo fp-repo test.flatpak $APP_ID 2>&1 | tee -a build.log
          ls -la test.flatpak
      - name: Errors
        if: failure()
        run: tail -n 50 build.log | sed -e 's/%/%25/g' -e 's/^/::warning title=log::/'
